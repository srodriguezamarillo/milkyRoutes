# Continuous integration for MilkyRoutes.
# Runs the full Maven verification on pull requests and on pushes to main.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Temurin JDK 21; setup-java's built-in Maven cache keyed on pom.xml.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Headless mode via JAVA_TOOL_OPTIONS so every JVM in the step
      # (Maven process and Surefire test JVMs) runs headless.
      - name: Build and verify
        env:
          JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
        run: mvn -B clean verify
